name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # 작업 브랜치에서도 바로 배포되도록 둔다.
      # main 으로 병합한 뒤에는 이 줄을 지워도 된다.
      - claude/lottery-predictor-6wGvU
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 마지막 것만 살린다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      - name: Pages 설정
        uses: actions/configure-pages@v5
        # enablement: true 는 쓰지 않는다. 워크플로 토큰에는 Pages 사이트를
        # 생성할 권한이 없어 "Resource not accessible by integration" 으로
        # 실패한다. 저장소 Settings → Pages → Source 를 GitHub Actions 로
        # 한 번 바꿔 두면 그 뒤로는 이 스텝이 설정을 읽기만 한다.

      - name: 산출물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
